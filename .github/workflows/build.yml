name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK; do not use setup-android,
      # its `sdkmanager tools` step fails on current runners.
      - name: Install platform 30 + build-tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          ls "$SDK/platforms" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || \
            yes | "$(ls -d $SDK/cmdline-tools/*/bin | tail -1)/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$(ls -d $SDK/cmdline-tools/*/bin | tail -1)/sdkmanager" --install "platforms;android-30" "build-tools;34.0.0"
          ls "$SDK/platforms"

      - name: Build APK
        run: bash build/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tb4117-uvc-apk
          path: build/tb4117-uvc-debug.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/tb4117-uvc-debug.apk
          generate_release_notes: true
